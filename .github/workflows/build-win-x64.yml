name: build-win-x64

# C 方案（客户端驱动挂机）宿主工程的云端打包验证
# 产出：BotClientDriverHost.exe（win-x64 self-contained singlefile，requireAdministrator manifest）

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore BotClientDriverHost/BotClientDriverHost.csproj

      - name: 编译（Release 验证）
        run: dotnet build BotClientDriverHost/BotClientDriverHost.csproj -c Release -r win-x64 --no-restore -v minimal

      - name: 离线定界自测（换服自动定界）
        run: dotnet run --project tools/FramingSelfTest/FramingSelfTest.csproj -c Release -v minimal

      - name: 离线拟真自测（拟人时序 / 鼠标轨迹 / 技能循环）
        run: dotnet run --project tools/HumanSelfTest/HumanSelfTest.csproj -c Release -v minimal

      - name: 发布 win-x64 单文件
        run: >
          dotnet publish BotClientDriverHost/BotClientDriverHost.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      # 把官方 Npcap 安装器原样放进分发包：宿主首次运行检测到缺失时会拉起官方安装向导
      # （免费版 Npcap 不支持 /S 静默安装，详见 NpcapEnvironment.TryInstall），装完宿主自动继续。
      # Npcap 是内核驱动，无法内嵌进单文件 exe —— 这是最接近"内置"的可行形态。
      # 下载失败不阻塞构建：宿主会退化为提示用户手动放置安装器。
      - name: 附带 Npcap 安装器（可选，自用分发）
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = "publish/npcap"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          try {
            $html = [string](Invoke-WebRequest -UseBasicParsing -Uri "https://npcap.com/dist/" -TimeoutSec 60).Content
            $vers = [regex]::Matches($html, 'npcap-([\d.]+)\.exe') |
                    ForEach-Object { $_.Groups[1].Value } | Sort-Object { [version]$_ } -Unique
            if (-not $vers) { throw "目录页里没解析到 npcap-*.exe 文件名" }
            $ver = $vers | Select-Object -Last 1
            $name = "npcap-$ver.exe"
            $out = Join-Path $dir $name
            Invoke-WebRequest -UseBasicParsing -Uri "https://npcap.com/dist/$name" -OutFile $out -TimeoutSec 300
            Write-Host ("[npcap] 已附带 {0} ({1:N2} MB)" -f $name, ((Get-Item $out).Length / 1MB))
            "NPCAP_BUNDLED=$name" | Out-File -Append $env:GITHUB_ENV
          } catch {
            Write-Warning "[npcap] 附带安装器失败（不影响构建）: $_"
          }

      - name: 运行测试（Windows 实机冒烟）
        shell: pwsh
        run: |
          $exe = "publish/BotClientDriverHost.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }
          Write-Host ("[1] exe 体积: {0:N2} MB" -f ((Get-Item $exe).Length / 1MB))

          # PE 架构必须是 x64 (Machine = 0x8664)
          $fs = [IO.File]::OpenRead($exe)
          $br = New-Object IO.BinaryReader($fs)
          $fs.Position = 0x3C; $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 4; $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          Write-Host ("[2] PE Machine = 0x{0:X4}" -f $machine)
          if ($machine -ne 0x8664) { throw "不是 x64 PE 文件" }

          # 单文件发布：目录里不应再有散落的托管 dll
          $dlls = @(Get-ChildItem publish -Filter *.dll -File)
          if ($dlls.Count -gt 0) { throw ("存在未内嵌的 dll: " + ($dlls.Name -join ",")) }
          Write-Host "[3] 无散落 dll，单文件发布成立"

          # 管理员 manifest 必须嵌入 exe
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($exe))
          if ($text -notmatch "requireAdministrator") { throw "manifest 未嵌入 requireAdministrator" }
          Write-Host "[4] manifest: requireAdministrator 已嵌入"

          # 用例 A：--help 必须正常退出
          $help = & $exe --help 2>&1 | Out-String
          Write-Host "[5] --help exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "--help 退出码异常: $LASTEXITCODE" }
          if ($help -notmatch "BotClientDriverHost") { throw "--help 输出缺少程序名" }
          Write-Host $help

          # 用例 B：空目录、无任何配置启动 -> 必须友好报错，不得静默退出或崩溃
          $bare = Join-Path $env:RUNNER_TEMP "bare-host"
          New-Item -ItemType Directory -Force -Path $bare | Out-Null
          Copy-Item $exe $bare -Force
          Push-Location $bare
          $out2 = & "$bare\BotClientDriverHost.exe" 2>&1 | Out-String
          $code2 = $LASTEXITCODE
          Pop-Location
          Write-Host "[6] 无配置启动 exit=$code2"
          Write-Host $out2
          if ($out2 -match "Unhandled exception") { throw "无配置路径出现未处理异常" }
          if ($code2 -eq 0) { throw "缺少配置时不应静默退出(0)" }
          if ($code2 -lt 0) { throw "进程异常终止: $code2" }

          # 用例 C：连不上服务端 -> 必须干净失败（走完整个登录前置流程）
          $out3 = & $exe --sniff-only --account smoke --password smoke --server smoke 2>&1 | Out-String
          $code3 = $LASTEXITCODE
          Write-Host "[7] 连接失败路径 exit=$code3"
          Write-Host $out3
          if ($out3 -match "Unhandled exception") { throw "连接失败路径出现未处理异常" }
          if ($code3 -eq 0) { throw "连不上服务端却返回 0" }

          # 用例 D：--install-npcap 指向不存在的安装器 -> 必须友好失败（不得抛未处理异常）
          $out4 = & $exe --install-npcap "$env:RUNNER_TEMP\no-such-dir\npcap-0.0.exe" 2>&1 | Out-String
          $code4 = $LASTEXITCODE
          Write-Host "[8] Npcap 补装失败路径 exit=$code4"
          Write-Host $out4
          if ($out4 -match "Unhandled exception") { throw "--install-npcap 路径出现未处理异常" }
          if ($code4 -lt 0) { throw "进程异常终止: $code4" }

          "SMOKE_RESULT=通过（PE/manifest/单文件/help/无配置/连接失败/Npcap补装 共 7 项）" | Out-File -Append $env:GITHUB_ENV
          "### 运行测试" >> $env:GITHUB_STEP_SUMMARY
          "- x64 PE 校验：通过" >> $env:GITHUB_STEP_SUMMARY
          "- 管理员 manifest：通过" >> $env:GITHUB_STEP_SUMMARY
          "- 单文件无散落 dll：通过" >> $env:GITHUB_STEP_SUMMARY
          "- --help 退出码 0：通过" >> $env:GITHUB_STEP_SUMMARY
          "- 无配置友好报错：通过" >> $env:GITHUB_STEP_SUMMARY
          "- 服务端不可达干净失败：通过" >> $env:GITHUB_STEP_SUMMARY
          "- Npcap 补装路径（不存在安装器）友好失败：通过" >> $env:GITHUB_STEP_SUMMARY

          # 断言全部通过：显式归零，避免末条用例的非零退出码污染本步骤结果
          exit 0

      - name: 产物清单
        shell: pwsh
        run: |
          Get-ChildItem -Recurse publish | Select-Object FullName, Length | Format-Table -AutoSize
          $exe = Get-ChildItem publish -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) { throw "未生成 exe" }
          "EXE_SIZE_BYTES=$($exe.Length)" | Out-File -Append $env:GITHUB_ENV
          "EXE_NAME=$($exe.Name)" | Out-File -Append $env:GITHUB_ENV

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BotClientDriverHost-win-x64
          path: publish/**
          if-no-files-found: error

      - name: 结果摘要
        shell: pwsh
        run: |
          "### 打包结果" >> $env:GITHUB_STEP_SUMMARY
          "- 产物：``$env:EXE_NAME``" >> $env:GITHUB_STEP_SUMMARY
          "- 体积：$([math]::Round([int]$env:EXE_SIZE_BYTES / 1MB, 2)) MB" >> $env:GITHUB_STEP_SUMMARY
          "- 随包 Npcap 安装器：$(if ($env:NPCAP_BUNDLED) { $env:NPCAP_BUNDLED } else { '未附带（下载失败，宿主会提示手动放置）' })" >> $env:GITHUB_STEP_SUMMARY
          "- 运行前提：管理员权限 + Windows x64；Npcap 缺失时由宿主拉起随包安装器的交互式向导（免费版不支持静默安装）" >> $env:GITHUB_STEP_SUMMARY
